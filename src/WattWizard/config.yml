verbose: no
server_mode: no

# InfluxDB configuration
influxdb_host: "montoxo.des.udc.es"
influxdb_bucket: "compute2"
influxdb_token: "MyToken"
influxdb_org: "MyOrg"

# Models configuration
structures: "host"
prediction_methods: "polyreg,sgdregressor"
model_variables: "user_load,system_load"

# Hardware info: Only required when using HW aware models
sockets: 2
cores_distribution:
  CPU0: "0-15,32-47"
  CPU1: "16-31,48-63"

# Cache time series in CSV files
csv_caching_train: yes
csv_caching_test: yes

# Train configuration
join_train_timestamps: no
train_timestamps_dir: "./conf/WattWizard/timestamps/train/default"
train_files: "all"

# Split points: divide the CPU-load range of each model at split points (in cores) selected automatically,
# adding the one that most reduces the MAPE (5-fold cross-validation) until it falls below the target (%)
# Only available for the "polyreg" prediction method
split_points: no
split_points_target_error: 5

# Test configuration
join_test_timestamps: no
test_timestamps_dir: "./conf/WattWizard/timestamps/test"
test_files: "all"

# Plots configuration
plot_time_series: no
plot_time_series_dir: "./conf/WattWizard/time_series"

